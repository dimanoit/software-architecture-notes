<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">LCOM cohesion examples</title>
  <desc id="desc">Class X has good cohesion, Class Y has low cohesion, and Class Z has mixed cohesion.</desc>
  <style>.h{font:700 21px system-ui,sans-serif;fill:#17202a}.t{font:600 20px system-ui,sans-serif;fill:#17202a}.w{font:600 18px system-ui,sans-serif;fill:#fff}.panel{fill:#fff;stroke:#475569;stroke-width:2;stroke-dasharray:6 5}.field{fill:#666;stroke:#17202a;stroke-width:3}.method{stroke:#17202a;stroke-width:3}.wire{stroke:#17202a;stroke-width:3}</style>
  <rect width="1000" height="420" fill="#fff"/>
  <g transform="translate(20 20)"><rect class="panel" width="300" height="370" rx="12"/><text class="h" x="150" y="40" text-anchor="middle">Class X - cohesive</text>
    <polygon class="field" points="40,85 55,70 95,70 110,85 110,125 95,140 55,140 40,125"/><polygon class="field" points="40,175 55,160 95,160 110,175 110,215 95,230 55,230 40,215"/><polygon class="field" points="40,265 55,250 95,250 110,265 110,305 95,320 55,320 40,305"/>
    <rect class="method" x="200" y="80" width="70" height="65" rx="8" fill="#c9ead9"/><rect class="method" x="200" y="170" width="70" height="65" rx="8" fill="#c9ead9"/><rect class="method" x="200" y="260" width="70" height="65" rx="8" fill="#c9ead9"/>
    <path class="wire" d="M110 105L200 202M110 195L200 112M110 195L200 292M110 285L200 202"/><text class="w" x="75" y="111" text-anchor="middle">A</text><text class="w" x="75" y="201" text-anchor="middle">B</text><text class="w" x="75" y="291" text-anchor="middle">C</text><text class="t" x="235" y="120" text-anchor="middle">m1()</text><text class="t" x="235" y="210" text-anchor="middle">m2()</text><text class="t" x="235" y="300" text-anchor="middle">m3()</text></g>
  <g transform="translate(350 20)"><rect class="panel" width="300" height="370" rx="12"/><text class="h" x="150" y="40" text-anchor="middle">Class Y - low cohesion</text>
    <polygon class="field" points="40,85 55,70 95,70 110,85 110,125 95,140 55,140 40,125"/><polygon class="field" points="40,175 55,160 95,160 110,175 110,215 95,230 55,230 40,215"/><polygon class="field" points="40,265 55,250 95,250 110,265 110,305 95,320 55,320 40,305"/>
    <rect class="method" x="200" y="80" width="70" height="65" rx="8" fill="#b9dced"/><rect class="method" x="200" y="170" width="70" height="65" rx="8" fill="#b9dced"/><rect class="method" x="200" y="260" width="70" height="65" rx="8" fill="#b9dced"/>
    <path class="wire" d="M110 105H200M110 195H200M110 285H200"/><text class="w" x="75" y="111" text-anchor="middle">A</text><text class="w" x="75" y="201" text-anchor="middle">B</text><text class="w" x="75" y="291" text-anchor="middle">C</text><text class="t" x="235" y="120" text-anchor="middle">m1()</text><text class="t" x="235" y="210" text-anchor="middle">m2()</text><text class="t" x="235" y="300" text-anchor="middle">m3()</text></g>
  <g transform="translate(680 20)"><rect class="panel" width="300" height="370" rx="12"/><text class="h" x="150" y="40" text-anchor="middle">Class Z - mixed</text>
    <polygon class="field" points="40,85 55,70 95,70 110,85 110,125 95,140 55,140 40,125"/><polygon class="field" points="40,175 55,160 95,160 110,175 110,215 95,230 55,230 40,215"/><polygon class="field" points="40,265 55,250 95,250 110,265 110,305 95,320 55,320 40,305"/>
    <rect class="method" x="200" y="80" width="70" height="65" rx="8" fill="#df8b92"/><rect class="method" x="200" y="170" width="70" height="65" rx="8" fill="#df8b92"/><rect class="method" x="200" y="260" width="70" height="65" rx="8" fill="#df8b92"/>
    <path class="wire" d="M110 105L200 202M110 195L200 112M110 285H200"/><text class="w" x="75" y="111" text-anchor="middle">A</text><text class="w" x="75" y="201" text-anchor="middle">B</text><text class="w" x="75" y="291" text-anchor="middle">C</text><text class="t" x="235" y="120" text-anchor="middle">m1()</text><text class="t" x="235" y="210" text-anchor="middle">m2()</text><text class="t" x="235" y="300" text-anchor="middle">m3()</text></g>
</svg>

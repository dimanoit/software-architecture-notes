<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" role="img" aria-labelledby="title desc">
  <title id="title">Personal technology radar</title>
  <desc id="desc">A technology radar with tools, techniques, languages and frameworks, and platforms divided into Adopt, Trial, Assess, and Hold rings.</desc>
  <defs><clipPath id="clip"><circle cx="450" cy="410" r="305"/></clipPath><style>.h{font:700 31px system-ui,sans-serif;fill:#17202a}.q{font:700 22px system-ui,sans-serif;fill:#17202a}.r{font:700 19px system-ui,sans-serif;fill:#334155}.n{font:700 11px system-ui,sans-serif;fill:#fff}.axis{stroke:#fff;stroke-width:5}.ring{fill:none;stroke:#fff;stroke-width:4}</style></defs>
  <rect width="900" height="820" fill="#fff"/><text class="h" x="450" y="48" text-anchor="middle">Personal Technology Radar</text>
  <circle cx="450" cy="410" r="305" fill="#d7d9da" stroke="#9ca3af" stroke-width="2"/>
  <g clip-path="url(#clip)"><rect x="145" y="105" width="305" height="305" fill="#d6e8ed" opacity=".45"/><rect x="450" y="105" width="305" height="305" fill="#dcebd8" opacity=".5"/><rect x="145" y="410" width="305" height="305" fill="#f8e3d8" opacity=".7"/><rect x="450" y="410" width="305" height="305" fill="#efd9e2" opacity=".7"/>
    <circle class="ring" cx="450" cy="410" r="85"/><circle class="ring" cx="450" cy="410" r="155"/><circle class="ring" cx="450" cy="410" r="230"/><line class="axis" x1="145" y1="410" x2="755" y2="410"/><line class="axis" x1="450" y1="105" x2="450" y2="715"/>
    <g fill="#099ab2"><circle cx="383" cy="335" r="13"/><circle cx="310" cy="310" r="13"/><circle cx="250" cy="240" r="13"/><circle cx="190" cy="350" r="13"/></g>
    <g fill="#4e9d50"><circle cx="520" cy="350" r="13"/><circle cx="585" cy="285" r="13"/><circle cx="665" cy="260" r="13"/><circle cx="700" cy="365" r="13"/></g>
    <g fill="#f36d13"><circle cx="365" cy="485" r="13"/><circle cx="290" cy="550" r="13"/><circle cx="210" cy="510" r="13"/><circle cx="340" cy="650" r="13"/></g>
    <g fill="#ac0f48"><circle cx="515" cy="485" r="13"/><circle cx="590" cy="550" r="13"/><circle cx="690" cy="515" r="13"/><circle cx="555" cy="660" r="13"/></g>
  </g>
  <text class="r" x="466" y="390">Adopt</text><text class="r" x="510" y="330">Trial</text><text class="r" x="555" y="250">Assess</text><text class="r" x="650" y="165">Hold</text>
  <text class="q" x="275" y="125" text-anchor="middle">Techniques</text><text class="q" x="625" y="125" text-anchor="middle">Languages &amp; Frameworks</text><text class="q" x="250" y="748" text-anchor="middle">Tools</text><text class="q" x="650" y="748" text-anchor="middle">Platforms</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Main Sequence and distance</title>
  <desc id="desc">Abstractness and instability chart with the Main Sequence, Zone of Pain, Zone of Uselessness, and a sample distance.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17202a"/></marker><marker id="redarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><style>.h{font:700 29px system-ui,sans-serif;fill:#17202a}.t{font:600 19px system-ui,sans-serif;fill:#17202a}.w{font:700 20px system-ui,sans-serif;fill:#fff}.axis{stroke:#17202a;stroke-width:3;marker-end:url(#arrow)}.guide{stroke:#64748b;stroke-width:2;stroke-dasharray:6 5}.dist{stroke:#dc2626;stroke-width:3;stroke-dasharray:7 5;marker-end:url(#redarrow)}</style></defs>
  <rect width="900" height="620" fill="#fff"/><text class="h" x="450" y="46" text-anchor="middle">Distance from the Main Sequence</text>
  <polygon points="120,100 700,500 120,500" fill="#e7a3a3"/><polygon points="120,70 750,70 750,500" fill="#72add2"/><polygon points="120,70 750,470 750,500 120,100" fill="#079447"/>
  <line class="axis" x1="120" y1="500" x2="790" y2="500"/><line class="axis" x1="120" y1="500" x2="120" y2="50"/>
  <line x1="120" y1="85" x2="750" y2="485" stroke="#fff" stroke-width="4"/>
  <text class="w" x="310" y="385" text-anchor="middle" transform="rotate(33 310 385)">Zone of Pain</text><text class="w" x="640" y="210" text-anchor="middle" transform="rotate(33 640 210)">Zone of Uselessness</text><text class="w" x="425" y="295" text-anchor="middle" transform="rotate(33 425 295)">Main Sequence</text>
  <text class="t" x="450" y="555" text-anchor="middle">Instability (I)</text><text class="t" transform="translate(65 290) rotate(-90)" text-anchor="middle">Abstractness (A)</text><text class="t" x="110" y="525" text-anchor="end">0</text><text class="t" x="750" y="525" text-anchor="middle">1</text><text class="t" x="102" y="82" text-anchor="end">1</text>
  <circle cx="505" cy="185" r="12" fill="#078dcc" stroke="#17202a" stroke-width="3"/><line class="guide" x1="505" y1="185" x2="505" y2="500"/><line class="guide" x1="120" y1="185" x2="505" y2="185"/><path class="dist" d="M500 195L430 250"/><text x="480" y="153" text-anchor="end" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#dc2626">sample module</text><text x="445" y="225" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#dc2626">D</text>
</svg>

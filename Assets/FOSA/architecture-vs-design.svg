<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Architecture versus design spectrum</title>
  <desc id="desc">Architecture has significant trade-offs, high effort, and strategic decisions; design has smaller trade-offs, lower effort, and tactical decisions.</desc>
  <defs>
    <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#078ad0"/><stop offset="1" stop-color="#c6e5f7"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111827"/></marker>
    <style>.t{font:700 31px system-ui,sans-serif;fill:#17202a}.l{font:500 21px system-ui,sans-serif;fill:#17202a}.b{font:700 25px system-ui,sans-serif;fill:#fff}.bd{font:700 25px system-ui,sans-serif;fill:#17202a}.tick{font:700 23px system-ui,sans-serif;fill:#17202a}.dash{stroke:#111827;stroke-width:4;stroke-dasharray:5 7;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="900" height="390" fill="#fff"/>
  <text class="t" x="450" y="49" text-anchor="middle">Architecture Versus Design</text>
  <text class="l" x="95" y="101">Significant trade-offs</text><line class="dash" x1="355" y1="94" x2="500" y2="94"/><text class="l" x="515" y="101">Insignificant trade-offs</text>
  <text class="l" x="95" y="143">High effort</text><line class="dash" x1="225" y1="136" x2="620" y2="136"/><text class="l" x="635" y="143">Low effort</text>
  <text class="l" x="95" y="185">Strategic</text><line class="dash" x1="205" y1="178" x2="650" y2="178"/><text class="l" x="665" y="185">Tactical</text>
  <rect x="85" y="215" width="730" height="88" rx="13" fill="url(#bar)" stroke="#17202a" stroke-width="4"/>
  <text class="b" x="115" y="270">Architecture</text><text class="bd" x="685" y="270">Design</text>
  <text class="tick" x="120" y="344" text-anchor="middle">A</text><text class="tick" x="340" y="344" text-anchor="middle">B</text><text class="tick" x="560" y="344" text-anchor="middle">C</text><text class="tick" x="780" y="344" text-anchor="middle">D</text>
</svg>
